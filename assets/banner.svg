<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1219"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: #e6edf3; }
    .card { fill: #161b22; stroke: #4a2c35; stroke-width: 2; }
    .num { font-size: 52px; font-weight: 700; fill: #d8c7cc; text-anchor: middle; }
    .c { opacity: 0; animation: pop 8s infinite; }
    .c1 { animation-delay: 0.2s; } .c2 { animation-delay: 0.5s; }
    .c3 { animation-delay: 0.8s; } .c4 { animation-delay: 1.1s; }
    .c5 { animation-delay: 1.4s; } .c6 { animation-delay: 1.7s; }
    @keyframes pop {
      0%   { opacity: 0; transform: translateY(24px); }
      6%   { opacity: 1; transform: translateY(0); }
      88%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
  </style>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="80" y1="78" x2="80" y2="122"/>
    <line x1="58" y1="100" x2="102" y2="100"/>
    <line x1="64" y1="84" x2="96" y2="116"/>
    <line x1="96" y1="84" x2="64" y2="116"/>
  </g>
  <circle cx="80" cy="170" r="22" fill="#e6edf3"/>
  <text x="80" y="177" text-anchor="middle" font-size="18" font-weight="700" fill="#0d1117">&lt;/&gt;</text>

  <text x="125" y="112" class="title">Personal</text>
  <text x="125" y="162" class="title">Coding Harness</text>

  <g class="c c1"><rect class="card" x="480" y="70"  width="85"  height="120" rx="10"/><text class="num" x="522" y="143">1</text></g>
  <g class="c c2"><rect class="card" x="540" y="66"  width="85"  height="128" rx="10"/><text class="num" x="582" y="146">2</text></g>
  <g class="c c3"><rect class="card" x="600" y="62"  width="85"  height="136" rx="10"/><text class="num" x="642" y="150">3</text></g>
  <g class="c c4"><rect class="card" x="660" y="58"  width="85"  height="144" rx="10"/><text class="num" x="702" y="154">4</text></g>
  <g class="c c5"><rect class="card" x="720" y="54"  width="85"  height="152" rx="10"/><text class="num" x="762" y="158">5</text></g>
  <g class="c c6"><rect class="card" x="780" y="50"  width="95"  height="160" rx="10"/><text class="num" x="827" y="142" font-size="64">6</text></g>
</svg>
